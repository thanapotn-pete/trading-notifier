<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TradeAnalytics - ประวัติการเทรด</title>


    <!-- ================= GOOGLE FONT ================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- ================= BOOTSTRAP ================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"
        rel="stylesheet"
    >


    <!-- ================= BOOTSTRAP ICONS ================= -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous"
    >


    <!-- ================= MAIN CSS ================= -->

    <link rel="stylesheet" href="css/style.css">


    <!-- ================= PAGE CSS ================= -->

    <link rel="stylesheet" href="css/pages/trade-history.css">

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>


<body>


<div class="app">


    <!-- =========================================================
         SIDEBAR
    ========================================================= -->

    <aside class="sidebar"><!-- สร้างโดย js/common.js (MENU_ITEMS) --></aside>



    <!-- =========================================================
         MAIN
    ========================================================= -->

    <main class="main-content">


        <!-- =====================================================
             TOPBAR
        ===================================================== -->

        <header class="topbar">


            <div>

                <div class="welcome" id="welcomeUser">
                    กำลังโหลด...
                </div>

                <h1>
                    ประวัติการเทรด
                </h1>

            </div>


            <div class="topbar-right">


                <!-- MT5 -->

                <span class="status-badge">

                    <span class="status-dot"></span>

                    MT5 Connected

                </span>


                <!-- TELEGRAM -->

                <span class="status-badge">

                    <span class="status-dot"></span>

                    Telegram Active

                </span>


                <!-- NOTIFICATION -->

                <button
    type="button"
    class="icon-button"
    aria-label="การแจ้งเตือน"
    data-href="notifications.html"
>
    <i class="bi bi-bell"></i>
</button>


                <!-- USER -->

                <div class="profile-menu">
    <div class="avatar" id="userAvatar">
        U
    </div>

    <div class="profile-dropdown" id="profileDropdown">
        <a href="profile.html">
            <i class="bi bi-person"></i>
            โปรไฟล์
        </a>

        <a href="#" id="avatarLogout">
            <i class="bi bi-box-arrow-right"></i>
            ออกจากระบบ
        </a>
    </div>
</div>


            </div>

        </header>



        <!-- =====================================================
             CONTENT
        ===================================================== -->

        <section class="content">


            <!-- =================================================
                 PAGE TITLE
            ================================================= -->

            <div class="d-flex justify-content-between align-items-end mb-3">


                <div>

                    <div class="page-description">

                        รายการซื้อขายที่บันทึกจากระบบ MT5

                    </div>

                </div>


                <div class="page-actions">

                    <button
                        type="button"
                        class="btn-export"
                    >

                        <i class="bi bi-download"></i>

                        Export รายงาน

                    </button>

                </div>


            </div>



            <!-- =================================================
                 SUMMARY
            ================================================= -->

            <div class="row g-3 history-summary">


                <!-- TOTAL TRADES -->

                <div class="col-md-6 col-xl-3">

                    <div class="history-summary-card">

                        <div>

                            <div class="history-summary-title">
                                จำนวนการเทรด
                            </div>

                            <div class="history-summary-value">
                                0
                            </div>

                        </div>


                        <div class="history-summary-icon">

                            <i class="bi bi-arrow-left-right"></i>

                        </div>

                    </div>

                </div>



                <!-- WIN -->

                <div class="col-md-6 col-xl-3">

                    <div class="history-summary-card">

                        <div>

                            <div class="history-summary-title">
                                ชนะ
                            </div>

                            <div class="history-summary-value green">
                                0
                            </div>

                        </div>


                        <div class="history-summary-icon">

                            <i class="bi bi-check-circle"></i>

                        </div>

                    </div>

                </div>



                <!-- LOSS -->

                <div class="col-md-6 col-xl-3">

                    <div class="history-summary-card">

                        <div>

                            <div class="history-summary-title">
                                แพ้
                            </div>

                            <div class="history-summary-value red">
                                0
                            </div>

                        </div>


                        <div
                            class="history-summary-icon"
                            style="
                                background:#fff2f2;
                                color:#dc2626;
                            "
                        >

                            <i class="bi bi-x-circle"></i>

                        </div>

                    </div>

                </div>



                <!-- WIN RATE -->

                <div class="col-md-6 col-xl-3">

                    <div class="history-summary-card">

                        <div>

                            <div class="history-summary-title">
                                Win Rate
                            </div>

                            <div class="history-summary-value">
                                0.0%
                            </div>

                        </div>


                        <div class="history-summary-icon">

                            <i class="bi bi-percent"></i>

                        </div>

                    </div>

                </div>


            </div>



            <!-- =================================================
                 FILTER
            ================================================= -->

            <div class="filter-card">


                <div class="filter-row">


                    <!-- SEARCH -->

                    <div class="filter-group search-group">

                        <label class="filter-label">
                            ค้นหา
                        </label>


                        <div class="search-wrapper">

                            <i class="bi bi-search"></i>

                            <input
                                type="text"
                                class="filter-input"
                                placeholder="ค้นหา Symbol เช่น EURUSD"
                                id="tradeSearch"
                            >

                        </div>

                    </div>



                    <!-- ACTION -->

                    <div class="filter-group">

                        <label class="filter-label">
                            ประเภท
                        </label>


                        <select
                            class="filter-select"
                            id="actionFilter"
                        >

                            <option value="">
                                ทั้งหมด
                            </option>

                            <option value="BUY">
                                BUY
                            </option>

                            <option value="SELL">
                                SELL
                            </option>

                        </select>

                    </div>



                    <!-- DATE -->

                    <div class="filter-group">

                        <label class="filter-label">
                            วันที่
                        </label>


                        <input
                            type="date"
                            class="filter-input"
                            id="dateFilter"
                        >

                    </div>



                    <!-- SEARCH BUTTON -->

                    <button
                        type="button"
                        class="btn-search"
                        data-action="filterTrades"
                    >

                        <i class="bi bi-search"></i>

                        ค้นหา

                    </button>



                    <!-- RESET -->

                    <button
                        type="button"
                        class="btn-reset"
                        data-action="resetFilters"
                    >

                        รีเซ็ต

                    </button>


                </div>


            </div>



            <!-- =================================================
                 TABLE
            ================================================= -->

            <div class="table-card">


                <!-- TABLE HEADER -->

                <div class="table-top">


                    <h2 class="table-title">
                        รายการเทรด
                    </h2>


                    <span class="table-count">
                        0 รายการ
                    </span>


                </div>



                <!-- TABLE -->

                <div class="table-responsive">


                    <table class="trade-table">


                        <thead>

                            <tr>

                                <th>
                                    SYMBOL
                                </th>

                                <th>
                                    ACTION
                                </th>

                                <th>
                                    PRICE
                                </th>

                                <th>
                                    LOT
                                </th>

                                <th>
                                    P/L
                                </th>

                                <th>
                                    STATUS
                                </th>

                                <th>
                                    วันที่ / เวลา
                                </th>

                            </tr>

                        </thead>


                        <tbody id="tradeTableBody">




                        </tbody>


                    </table>


                </div>



                <!-- =================================================
                     FOOTER
                ================================================= -->

                <div class="table-footer">


                    <div class="table-footer-info">

                        แสดง 0 รายการ

                    </div>


                    <div class="pagination">


                        <button
                            type="button"
                            class="page-button disabled"
                        >

                            <i class="bi bi-chevron-left"></i>

                        </button>


                        <button
                            type="button"
                            class="page-button active"
                        >
                            1
                        </button>


                        <button
                            type="button"
                            class="page-button"
                        >
                            2
                        </button>


                        <button
                            type="button"
                            class="page-button"
                        >
                            3
                        </button>


                        <button
                            type="button"
                            class="page-button"
                        >

                            <i class="bi bi-chevron-right"></i>

                        </button>


                    </div>


                </div>


            </div>


        </section>


    </main>


</div>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="js/pages/trade-history.js"></script>


</body>

</html>
