services:
  - type: web
    name: trading-notifier
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: 3000
      - key: TIMEZONE
        value: Asia/Bangkok
      - key: DAILY_SUMMARY_CRON
        value: "0 23 * * *"
      - key: WEEKLY_SUMMARY_CRON
        value: "0 23 * * 0"
      - key: JWT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
